<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>划词翻译 - 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>划词翻译</h1>
      <p class="subtitle">配置 AI 翻译 API</p>
    </header>

    <div class="toast" id="toast"></div>

    <form id="settingsForm" class="form">
      <div class="form-group">
        <label for="endpoint">API Endpoint</label>
        <input type="text" id="endpoint" placeholder="https://api.openai.com/v1" autocomplete="off">
        <span class="hint">支持所有 OpenAI 兼容接口（DeepSeek、通义千问等）</span>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <div class="password-wrapper">
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
          <button type="button" id="toggleKey" class="toggle-btn" title="显示/隐藏">👁</button>
        </div>
        <span class="hint">密钥仅保存在本地浏览器中</span>
      </div>

      <div class="form-group">
        <label for="model">Model</label>
        <div class="input-with-btn">
          <input type="text" id="model" placeholder="gpt-4o-mini" autocomplete="off" list="modelList">
          <datalist id="modelList"></datalist>
          <button type="button" id="fetchModelsBtn" class="btn btn-sm btn-outline">获取模型</button>
        </div>
        <span class="hint">手动填写或点击「获取模型」自动拉取 API 可用模型列表</span>
      </div>

      <div class="form-group">
        <label for="systemPrompt">System Prompt</label>
        <textarea id="systemPrompt" rows="3" placeholder="你是一个翻译助手..."></textarea>
        <span class="hint">使用 <code>{target}</code> 作为目标语言占位符</span>
      </div>

      <div class="form-group">
        <label for="targetLang">目标语言</label>
        <select id="targetLang">
          <option value="zh-CN">中文（简体）</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <div class="actions">
        <button type="button" id="testBtn" class="btn btn-outline">测试连接</button>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-primary">保存配置</button>
      </div>

      <div id="testResult" class="test-result" style="display:none"></div>
    </form>
  </div>

  <script type="module" src="settings.ts"></script>
</body>
</html>
