<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- globe body -->
  <circle cx="64" cy="60" r="30" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.95"/>

  <!-- vertical meridian -->
  <ellipse cx="64" cy="60" rx="10" ry="30" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>

  <!-- horizontal equator -->
  <line x1="34" y1="48" x2="94" y2="48" stroke="#ffffff" stroke-width="2" opacity="0.65"/>
  <line x1="34" y1="72" x2="94" y2="72" stroke="#ffffff" stroke-width="2" opacity="0.65"/>

  <!-- left arrow -->
  <path d="M70 96 L70 108 L86 102 Z" fill="#ffffff" opacity="0.9"/>
  <!-- right arrow -->
  <path d="M58 96 L58 108 L42 102 Z" fill="#ffffff" opacity="0.9"/>
</svg>
